<link rel="stylesheet" href="../styles/dashboard.css">

<header>
    <h1>Dashboard Administrativo</h1>

    <div class="usuario_logado">
        <span id="nome_usuario">Carregando...</span>
        <button id="btn_sair">Sair</button>
    </div>

    <script type="module" src="../scripts/dashboard.js"></script>

</header>

<main>
    <section class="cards_resumo">

        <div class="card">
            <h3>Usuários</h3>
            <p id="quantidade_usuarios">0</p>
        </div>

        <div class="card">
            <h3>Dispositivos</h3>
            <p id="quantidade_dispositivos">0</p>
        </div>

    </section>


    <section class="painel_container">

        <!-- Usuarios -->
        <section class="painel">

            <div class="painel_header">
                <h2>Controle de Usuários</h2>

                <button class="btn">
                    + Novo Usuário
                </button>
            </div>

            <table>

                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>Perfil</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="tabela_usuarios">

                    <tr>
                        <td colspan="4">
                            Carregando usuários...
                        </td>
                    </tr>

                </tbody>

            </table>

        </section>


        <!-- Dispositivos -->
        <section class="painel">

            <div class="painel_header">

                <h2>Controle de Dispositivos</h2>

                <button class="btn">
                    + Novo Dispositivo
                </button>

            </div>

            <table>

                <thead>
                    <tr>
                        <th>Chave</th>
                        <th>Dono</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="tabela_dispositivos">

                    <tr>
                        <td colspan="3">
                            Carregando dispositivos...
                        </td>
                    </tr>

                </tbody>

            </table>

        </section>

    </section>

</main>
